<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TikTok Farm — Overlay</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0b0f24; overflow: hidden; }
    body { display: flex; align-items: center; justify-content: center; }
    /* Resolução interna fixa 1080x1920 (9:16); a tela só escala para caber. */
    canvas { display: block; width: min(100vw, calc(100vh * 9 / 16)); height: auto; }
  </style>
</head>
<body>
  <canvas id="game" width="1080" height="1920"></canvas>
  <script type="module" src="js/main.js"></script>
</body>
</html>
